<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="students-page">

        <h1>Student Management System</h1>

        <a href="/add-student" class="add-link">
            Add New Student
        </a>

        <form method="GET" action="/students" class="search-form">

            <input type="text"
                   name="search"
                   placeholder="Search by name, email or course"
                   value="{{ search }}">

            <button type="submit">Search</button>

            <a href="/students">Clear</a>

        </form>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th>PHONE</th>
                        <th>COURSE</th>
                        <th>AGE</th>
                        <th>ACTION</th>
                    </tr>
                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>
                        <td>{{ student[0] }}</td>
                        <td>{{ student[1] }}</td>
                        <td>{{ student[2] }}</td>
                        <td>{{ student[3] }}</td>
                        <td>{{ student[4] }}</td>
                        <td>{{ student[5] }}</td>

                        <td>
                            <a href="/edit-student/{{ student[0] }}">
                                Edit
                            </a>

                            |

                            <a href="/delete-student/{{ student[0] }}"
                               onclick="return confirm('Are you sure you want to delete this student?')">
                                Delete
                            </a>
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
